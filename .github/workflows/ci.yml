name: CI

on:
  push:
  pull_request:

env:
  BUSINESS_TIME_ZONE: America/Sao_Paulo
  TZ: America/Sao_Paulo

jobs:
  backend-coverage:
    name: Backend coverage (100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm exec prisma generate
        working-directory: backend
      - name: Unit tests with 100% coverage gates
        run: pnpm run test:coverage
        working-directory: backend

  frontend-coverage:
    name: Frontend coverage (100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Unit tests with 100% coverage gates
        run: pnpm run test:coverage
        working-directory: frontend

  backend-integration:
    name: Backend integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: financeiro_test
          POSTGRES_PASSWORD: financeiro_test
          POSTGRES_DB: financeiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financeiro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://financeiro_test:financeiro_test@localhost:5432/financeiro_test
      TEST_DATABASE_URL: postgresql://financeiro_test:financeiro_test@localhost:5432/financeiro_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm exec prisma generate
        working-directory: backend
      - run: pnpm exec prisma migrate deploy
        working-directory: backend
      - run: pnpm run test:integration
        working-directory: backend

  build:
    name: Build
    needs: [backend-coverage, frontend-coverage, backend-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm exec prisma generate
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: backend
      - run: pnpm run build
        working-directory: frontend
